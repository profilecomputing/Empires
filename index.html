<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Empires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  </head>
  <body>
    <div class="container pt-3">
        <h1>Empires</h1>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="users_choice" placeholder="Your choice">
          <label for="users_choice">Your choice</label>
        </div>


        <div class="d-grid gap-2">
          <button class="btn btn-primary" id="add_choice">Next</button>
          <button class="btn btn-success" id="print_names">Print Names</button>
          <button class="btn btn-danger" id="clear">Clear</button>
        </div>
    </div>
    <div class="container pt-3">
      <ul class="list-group" id="results">
      </ul>
    </div>
    <script src="./index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  </body>
</html>
